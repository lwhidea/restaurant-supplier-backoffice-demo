  function v230CreateForm(){let d=s.v230Draft||{},firstMonday=new Date();firstMonday.setDate(firstMonday.getDate()+((8-firstMonday.getDay())%7));let dateObj=d.bidDeadline?new Date(d.bidDeadline):d.start?new Date(d.start):firstMonday;dateObj.setHours(12,0,0,0);if(d.bidDeadline)dateObj.setDate(dateObj.getDate()+1);if(dateObj.getDay()!==1)dateObj.setDate(dateObj.getDate()+((8-dateObj.getDay())%7));let date=dateObj.toISOString().slice(0,10);return '<section class="v230-card"><h2>新建一周需求招标（按日发货）</h2><div class="v230-note">本模式与固定需求并列；只创建新的按日计划记录，不改动现有固定需求、员工或订单数据。</div><div class="v230-form"><div class="v230-field"><label>计划名称</label><input data-v230-input="new-name" value="'+v230Esc(d.title||'')+'" placeholder="例如：冻品一周按日招标"></div><div class="v230-field"><label>周一配送日期</label><input data-v230-input="new-start" type="date" value="'+date+'"></div><div class="v230-field"><label>需求截标时间</label><input data-v230-input="new-cutoff" type="datetime-local" value="'+v230Esc(d.bidDeadline||'')+'"></div></div><div class="v230-sep"></div><h3>参与门店</h3><div class="v230-row">'+v230Stores().map((x,i)=>'<label><input type="checkbox" data-v230-store="'+i+'" checked> '+v230Esc(x)+'</label>').join('')+'</div><div class="v230-sep"></div><h3>招标 SKU</h3><div class="v230-row">'+v230Skus().map((x,i)=>'<label><input type="checkbox" data-v230-sku="'+i+'" '+((!d.skus||!d.skus.length||d.skus.includes(x.name))&&(!d.categories?.length||d.categories.includes(x.category))?'checked':'')+'> '+v230Esc(x.name)+'（'+v230Esc(x.unit)+'）</label>').join('')+'</div><div class="v230-footer"><span class="v230-muted">配送日期按所选周一至周日固定生成；每日到货截止默认 08:00。</span>'+v230Button('创建计划','create-plan','primary')+'</div></section>'}
  function v230Settings(p){return '<section class="v230-card"><h2>计划设置 · 周一至周日</h2><div class="v230-note">日期为固定周期，管理员只调整每日到货截止时间。门店与供应商不能修改配送日期。</div><div class="v230-table-wrap"><table><thead><tr><th>配送日</th><th>日期</th><th>星期</th><th>到货截止时间</th></tr></thead><tbody>'+p.dates.map((date,i)=>'<tr><td>第 '+(i+1)+' 天</td><td>'+date.slice(5).replace('-','/')+'</td><td>'+v230Days[i]+'</td><td><input type="time" data-v230-cutoff="'+i+'" value="'+v230Esc(p.cutoffs[i]||'08:00')+'"></td></tr>').join('')+'</tbody></table></div><div class="v230-footer"><span>'+v230Badge(p.statusLabel||p.status)+' · '+p.stores.length+' 家门店 · '+p.skus.length+' 个 SKU</span>'+v230Button('保存每日截止时间','save-cutoffs','primary')+'</div></section>'}
  function v230Demand(p){let store=p.stores[s.v230StoreIndex||0]||p.stores[0];if(!store)return '<section class="v230-card"><div class="v230-empty">请先在计划设置中添加参与门店。</div></section>';let lines=p.skus.map((sk,si)=>{let d=p.demands?.[store]?.[sk.id]||{weekQty:'',days:Array(7).fill('')};return '<div class="v230-card"><h3>'+v230Esc(sk.name)+' · '+v230Esc(sk.unit)+'</h3><div class="v230-days">'+v230Days.map((day,i)=>'<label class="v230-day"><small>'+day+' · '+p.dates[i].slice(5).replace('-','/')+'</small><input type="number" min="0" step="1" data-v230-demand-day="'+i+'" data-sku-index="'+si+'" value="'+v230Esc(d.days[i]??'')+'" placeholder="数量"></label>').join('')+'</div><div class="v230-footer"><label>本周采购需求 <input type="number" min="1" step="1" data-v230-week-total="'+si+'" value="'+v230Esc(d.weekQty??'')+'" placeholder="周总量" style="width:110px"></label><span data-v230-sum="'+si+'" class="v230-muted">已分配 '+d.days.reduce((n,x)=>n+Number(x||0),0)+' / '+(d.weekQty||0)+' '+v230Esc(sk.unit)+'</span>'+v230Button('保存此 SKU','save-demand','secondary','data-sku-index="'+si+'"')+'</div></div>'}).join('');return '<section class="v230-card"><h2>门店需求 · '+v230Esc(store)+'</h2><div class="v230-row">'+p.stores.map((x,i)=>'<button class="btn '+(x===store?'primary':'secondary')+'" data-v230="select-store" data-store-index="'+i+'">'+v230Esc(x)+'</button>').join('')+'</div><div class="v230-note">周总量锁定，七日分配必须与周总量相等。短缺或超出都会标红并阻止提交。</div>'+lines+'<div class="v230-footer"><span>门店提交进度：'+p.stores.filter(x=>p.demands?.[x]&&p.skus.every(sk=>p.demands[x]?.[sk.id]?.submitted)).length+' / '+p.stores.length+' 家</span>'+v230Button('提交本店需求','submit-store-demand','primary')+'</div></section>'}
  function v230DemandSummary(p){let totals=p.skus.map(sk=>({sku:sk,week:v230Total(p,sk.id),days:p.dates.map((_,i)=>p.stores.reduce((n,st)=>n+Number(p.demands?.[st]?.[sk.id]?.days?.[i]||0),0))}));s.v230Expanded=s.v230Expanded||{};return '<section class="v230-card"><h2>需求快照 · 默认按 SKU 汇总</h2><div class="v230-note">仅在所有门店 × SKU 均提交且七日合计正确后允许发布。默认显示 SKU 总行；展开后门店明细直接接在总行下方，沿用相同列头。</div><div class="v230-table-wrap"><table><thead><tr><th>门店 / 汇总</th><th>SKU</th><th>本周采购需求</th><th>每日计划量（周一至周日）</th></tr></thead><tbody>'+totals.map(x=>'<tr><td><b>总（'+p.stores.length+' 家）</b> '+v230Button(s.v230Expanded[x.sku.id]?'收起门店明细':'展开门店明细','toggle-details','secondary','data-sku="'+v230Esc(x.sku.id)+'"')+'</td><td>'+v230Esc(x.sku.name)+'</td><td><b>'+x.week+' '+v230Esc(x.sku.unit)+'</b></td><td>'+x.days.join(' · ')+'</td></tr>'+(s.v230Expanded[x.sku.id]?p.stores.map(st=>{let d=p.demands?.[st]?.[x.sku.id]||{weekQty:0,days:Array(7).fill(0)};return '<tr><td>'+v230Esc(st)+'</td><td>'+v230Esc(x.sku.name)+'</td><td>'+Number(d.weekQty||0)+' '+v230Esc(x.sku.unit)+'</td><td>'+d.days.map(n=>Number(n||0)).join(' · ')+'</td></tr>'}).join(''):'')).join('')+'</tbody></table></div><div class="v230-footer"><span class="'+(v230SnapshotReady(p)?'v230-good':'v230-warn')+'">'+(v230SnapshotReady(p)?'全部需求已校验，可以锁定快照':'未完成：每家门店的每个 SKU 都必须提交且七日合计相等')+'</span>'+v230Button(p.snapshot?'重新查看已锁定快照':'确认快照并发布招标','publish-snapshot','primary',v230SnapshotReady(p)&&!p.snapshot?'':'disabled')+'</div></section>'}
  function v230SupplierQuotes(p){let supplier=(db.suppliers||[]).find(x=>x.id===s.v230SupplierId)||null;let supplierChoices=(db.suppliers||[]).map(x=>'<option value="'+v230Esc(x.id)+'" '+(x.id===s.v230SupplierId?'selected':'')+'>'+v230Esc(x.companyName||x.id)+'</option>').join('');if(!supplier&&db.suppliers?.length){supplier=db.suppliers[0];s.v230SupplierId=supplier.id}let quoteRows=p.skus.map((sk,i)=>{let q=p.quotes?.[supplier?.id]?.[sk.id]||{};let weekly=v230Total(p,sk.id);return '<tr><td>'+v230Esc(sk.name)+'<br><small>'+v230Esc(sk.category)+'</small></td><td>'+weekly+' '+v230Esc(sk.unit)+'</td><td><input type="number" min="0.01" step="0.01" data-v230-price="'+i+'" value="'+v230Esc(q.price??'')+'" placeholder="报价"></td><td><input type="number" min="1" step="1" data-v230-max="'+i+'" value="'+v230Esc(q.maxSupply??'')+'" placeholder="必填"> '+v230Esc(sk.unit)+'</td><td>'+v230Button('保存报价','save-quote','secondary','data-sku-index="'+i+'"')+'</td></tr>'}).join('');let daily=p.skus.map(sk=>'<p>'+v230Esc(sk.name)+'：'+p.dates.map((d,i)=>v230Days[i]+' '+d.slice(5).replace('-','/')+' '+p.stores.reduce((n,st)=>n+Number(p.demands?.[st]?.[sk.id]?.days?.[i]||0),0)+' '+v230Esc(sk.unit)).join(' · ')+'</p>').join('');return '<section class="v230-card"><h2>供应商投标 · '+(p.snapshot?'需求快照 v'+p.snapshot.revision:'尚未发布需求')+'</h2>'+(p.snapshot?'<div class="v230-row"><label>供应商： <select data-v230-input="supplier-select"><option value="">请选择供应商</option>'+supplierChoices+'</select></label><span class="v230-muted">未配置供应商档案时，请先从原型的供应商准入模块添加。</span></div><div class="v230-note">固定需求量来自管理员快照。按 SKU 报价并填写必填最大可供应量；额外容量用于新增采购需求时优先通知。</div><details class="v230-card"><summary>查看每日配送量</summary>'+daily+'</details><details class="v230-card"><summary>申报每日可供量（默认收起）</summary>'+p.skus.map((sk,i)=>'<h3>'+v230Esc(sk.name)+' · 每日可供量（'+v230Esc(sk.unit)+'）</h3><div class="v230-days">'+v230Days.map((day,di)=>'<label class="v230-day"><small>'+day+' '+p.dates[di].slice(5).replace('-','/')+'</small><input type="number" min="0" step="1" data-v230-day-cap="'+di+'" data-sku-index="'+i+'" value="'+v230Esc(p.quotes?.[supplier?.id]?.[sk.id]?.daily?.[di]??'')+'" placeholder="必填"></label>').join('')+'</div>').join('')+'</details><div class="v230-table-wrap"><table><thead><tr><th>SKU</th><th>固定采购需求</th><th>报价（元）</th><th>最大可供应量（必填）</th><th>操作</th></tr></thead><tbody>'+quoteRows+'</tbody></table></div>':'<div class="v230-empty">管理员发布快照后，供应商才能查看准确需求并报价。</div>')+'</section>'}
  function v230Award(p){let quotes=Object.entries(p.quotes||{}).flatMap(([supplierId,rows])=>Object.entries(rows).map(([skuId,q])=>({supplierId,skuId,price:Number(q.price),capacity:Number(q.maxSupply)})));let suppliers=[...new Set(quotes.map(x=>x.supplierId))].map(id=>(db.suppliers||[]).find(x=>x.id===id)?.companyName||id);let awards=p.awards||[];return '<section class="v230-card"><h2>定标与订单 · 供应商容量覆盖</h2><div class="v230-note">定标按 SKU、供应商容量和每日门店需求分配。供应商能力足量时按需求门店自动分配；不足时支持多供应商承接，未覆盖部分单独作为缺口。</div>'+(p.snapshot?'<div class="v230-grid">'+p.skus.map(sk=>{let required=v230Total(p,sk.id),capacity=quotes.filter(q=>q.skuId===sk.id).reduce((n,q)=>n+q.capacity,0),covered=Math.min(required,capacity);return '<div class="v230-kpi"><span>'+v230Esc(sk.name)+'</span><b>'+covered+' / '+required+' '+v230Esc(sk.unit)+'</b><small>已申报可供 '+capacity+' '+v230Esc(sk.unit)+' · '+(capacity>=required?'覆盖':'缺口 '+(required-capacity))+'</small></div>'}).join('')+'</div>'+v230Button(awards.length?'重新计算分配':'确认定标并生成日订单','make-awards','primary')+(awards.length?'<div class="v230-table-wrap" style="margin-top:12px"><table><thead><tr><th>供应商</th><th>门店</th><th>配送日期 / 星期</th><th>SKU</th><th>订单量</th><th>订单状态</th></tr></thead><tbody>'+awards.map(o=>o.lines.map(li=>'<tr><td>'+v230Esc(o.supplierName)+'</td><td>'+v230Esc(o.store)+'</td><td>'+o.date+' '+v230Esc(o.weekday)+'</td><td>'+v230Esc(li.skuName)+'</td><td>'+li.qty+' '+v230Esc(li.unit)+'</td><td>'+v230Esc(o.status)+'</td></tr>').join('')).join('')+'</tbody></table></div>':'')+(p.gaps?.length?'<div class="v230-note v230-warn">待兜底缺口：'+p.gaps.map(g=>v230Esc(g.skuName)+' '+g.qty+' '+v230Esc(g.unit)).join('；')+'。请管理员安排补单/临采。</div>':''):'<div class="v230-empty">发布需求快照后可投标和定标。</div>')+'</section>'}
  function v230Operations(p,actor){

    let receipts=orders.filter(x=>x.receiptStatus==='已验收'&&x.financeConfirmed),financePending=orders.filter(x=>x.receiptStatus==='待财务确认'),invoices=p.invoices||[];

    let additionForm=actor==='store'&&orders.length?'<section class="v230-card"><h3>周期内追加需求</h3><div class="v230-form"><div class="v230-field"><label>配送日期</label><select data-v230-input="addition-date">'+p.dates.map((d,i)=>'<option value="'+d+'">'+d+' '+v230Days[i]+'</option>').join('')+'</select></div><div class="v230-field"><label>SKU</label><select data-v230-input="addition-sku">'+p.skus.map(sk=>'<option value="'+v230Esc(sk.id)+'">'+v230Esc(sk.name)+'</option>').join('')+'</select></div><div class="v230-field"><label>追加数量</label><input type="number" min="1" step="1" data-v230-input="addition-qty"></div></div><div class="v230-footer"><span class="v230-muted">最晚配送日前一天提交；沿用原中标价，管理员审核后定向通知有余量供应商。</span>'+v230Button('提交追加申请','request-addition','primary')+'</div></section>':'';

    let financePanel=actor==='finance'?'<section class="v230-card"><h3>财务验收确认</h3><div class="v230-list">'+financePending.map(o=>'<div class="v230-item"><div><b>'+v230Esc(o.id)+' · '+v230Esc(o.store)+' · '+o.date+' · '+v230Esc(o.supplierName)+'</b><p>'+o.lines.map(li=>v230Esc(li.skuName)+' 合格 '+Number(li.acceptedQty||0)+' '+v230Esc(li.unit)).join('；')+'</p></div>'+v230Button('确认验收并进入结算','finance-confirm-receipt','primary','data-order="'+v230Esc(o.id)+'"')+'</div>').join('')+(financePending.length?'':'<div class="v230-empty">暂无待确认验收单。</div>')+'</div></section><section class="v230-card"><h3>发票核验、付款与归档</h3><div class="v230-list">'+invoices.map(x=>'<div class="v230-item"><div><b>'+v230Esc(x.id)+' · '+x.count+' 个 SKU · '+v230Money(x.amount)+'</b><p>'+v230Esc(x.store)+' · '+x.date+' · '+v230Esc(x.status)+'</p></div><div class="v230-actions">'+(x.status==='待财务校验'?v230Button('核验通过','verify-invoice','primary','data-invoice-id="'+v230Esc(x.id)+'"'):'')+(x.status==='待付款'?v230Button('确认付款','pay-invoice','primary','data-invoice-id="'+v230Esc(x.id)+'"'):'')+(x.status==='已付款'?v230Button('归档并完成','archive-invoice','primary','data-invoice-id="'+v230Esc(x.id)+'"'):'')+'</div></div>').join('')+(invoices.length?'':'<div class="v230-empty">供应商提交发票后，会在此核验。</div>')+'</div></section>':'';

<script>
// v2.26: fair per-SKU allocation with live supplier-capacity totals and hard per-supplier limits.
function v225Supply(bidId,sku,supplierId){let q=(db.quotes||[]).find(x=>x.bid===bidId&&x.supplierId===supplierId),line=(q?.lines||[]).find(x=>x.skuId===skuKey(sku));return Number(line?.quantity||0)}
function v225Step(sku){return skuMeasure(sku).unit==='kg'?0.1:1}
function v225Ticks(n,step){return Math.max(0,Math.floor((Number(n||0)+1e-8)/step))}
function v225FairAllocate(rows,availableTicks,step){let active=rows.map(x=>({a:x.a,left:Math.max(0,v225Ticks(x.a.need,step)-v225Ticks(x.a.qty,step))})).filter(x=>x.left>0),left=Math.max(0,availableTicks);while(left>0&&active.length){let share=Math.floor(left/active.length);if(share<1){active.forEach(function(x){if(left>0&&x.left>0){x.a.qty=Number((Number(x.a.qty||0)+step).toFixed(6));x.left--;left--}});active=active.filter(x=>x.left>0);continue}let spent=0;active.forEach(function(x){let take=Math.min(share,x.left);if(take){x.a.qty=Number((Number(x.a.qty||0)+take*step).toFixed(6));x.left-=take;left-=take;spent+=take}});active=active.filter(x=>x.left>0);if(!spent)break}}
function v225RebalanceAwards(bidId){let allocations=s.awardAlloc||[],changed=false,skus=new Map();allocations.forEach(function(a){let key=skuKey(a.sku);if(!skus.has(key))skus.set(key,a.sku)});skus.forEach(function(sku,key){let skuRows=allocations.filter(a=>skuKey(a.sku)===key),bySupplier=new Map();skuRows.forEach(function(a){if(!a.supplierId){if(!a.qtyManual&&Number(a.qty||0)!==0){a.qty=0;changed=true}return}if(!bySupplier.has(a.supplierId))bySupplier.set(a.supplierId,[]);bySupplier.get(a.supplierId).push(a)});let step=v225Step(sku);bySupplier.forEach(function(rows,supplierId){let supplyTicks=v225Ticks(v225Supply(bidId,sku,supplierId),step),fixed=rows.filter(a=>a.qtyManual),fixedTicks=fixed.reduce((n,a)=>n+v225Ticks(a.qty,step),0);if(fixedTicks>supplyTicks){fixed.forEach(function(a){a.qtyManual=false});fixed=[];fixedTicks=0}let auto=rows.filter(a=>!a.qtyManual),old=auto.map(a=>Number(a.qty||0));auto.forEach(a=>{a.qty=0});v225FairAllocate(auto.map(a=>({a:a})),Math.max(0,supplyTicks-fixedTicks),step);auto.forEach(function(a,i){if(Math.abs(Number(a.qty||0)-old[i])>1e-8)changed=true})})});return changed}
function v225DecorateAllocation(html,bidId){let allocations=s.awardAlloc||[];return html.replace(/<input\b[^>]*data-alloc-qty="(\d+)"[^>]*>/g,function(input,index){let a=allocations[Number(index)];if(!a||!a.supplierId)return input;let sku=skuKey(a.sku),cap=v225Supply(bidId,a.sku,a.supplierId),other=allocations.filter(function(x,j){return j!==Number(index)&&skuKey(x.sku)===sku&&x.supplierId===a.supplierId}).reduce(function(n,x){return n+Number(x.qty||0)},0),max=Math.max(0,Math.min(Number(a.need||0),cap-other));if(/\bmax="[^"]*"/.test(input))input=input.replace(/\bmax="[^"]*"/,'max="'+max+'"');else input=input.replace(/>$/,' max="'+max+'">');input=input.replace(/class="([^"]*)"/,'class="$1 award-capacity-input"');if(!/class="/.test(input))input=input.replace('<input','<input class="award-capacity-input"');return input})}
const v225EvaluationBase=evaluation;evaluation=function(){let html=v225EvaluationBase.call(this);if(s.role!=='admin')return html;let bid=(db.tenders||[]).find(x=>x[0]===s.activeBid);if(!bid||!html.includes('data-alloc-qty=')||!html.includes('submit-award'))return html;if(v225RebalanceAwards(bid[0]))html=v225EvaluationBase.call(this);html=html.replace('每个 SKU 先选择一位中标供应商，默认覆盖全部门店；点击“拆分供应商”后，可在门店层分别调整供应商和试货设置。','每个 SKU 默认将所选供应商的可供量在门店间平均分配；达到单店需求上限后，余量继续分给尚未满足的门店。改派个别门店后，其他门店按各自供应商的剩余可供量重新均分。');return v225DecorateAllocation(html,bid[0])};
document.addEventListener('change',function(e){let el=e.target;if(!el.matches('[data-award-sku-supplier],[data-alloc-supplier],[data-alloc-qty]'))return;e.stopImmediatePropagation();let bid=(db.tenders||[]).find(x=>x[0]===s.activeBid);if(!bid)return;let key;if(el.matches('[data-award-sku-supplier]')){key=el.dataset.awardSkuSupplier;(s.awardAlloc||[]).forEach(function(a){if(skuKey(a.sku)===key){a.supplierId=el.value;a.supplierManual=false;a.qtyManual=false;a.qty=0}})}else{let i=Number(el.dataset.allocSupplier||el.dataset.allocQty),a=(s.awardAlloc||[])[i];if(!a)return;key=skuKey(a.sku);if(el.matches('[data-alloc-supplier]')){a.supplierId=el.value;a.supplierManual=true;a.qtyManual=false;a.qty=0}else{let next=Number(el.value||0),other=(s.awardAlloc||[]).filter(function(x,j){return j!==i&&skuKey(x.sku)===key&&x.supplierId===a.supplierId}).reduce(function(n,x){return n+Number(x.qty||0)},0),cap=a.supplierId?v225Supply(bid[0],a.sku,a.supplierId):0;if(!Number.isFinite(next)||next<0||next>a.need){toast('分配数量须在 0 与该门店需求量之间');return}if(next+other>cap+1e-8){toast('该供应商 SKU 分配合计不能超过可供量 '+qtyText(a.sku,cap));return}a.qty=next;a.qtyManual=true}}s.awardReasonDraft=document.querySelector('#award-reason')?.value||s.awardReasonDraft||'';v225RebalanceAwards(bid[0]);render()},true);
